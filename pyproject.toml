[project]
name = "agent-netology"
version = "0.1.0"
description = "Store support agent on LangChain/LangGraph with RAG (Qdrant) and human approval"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "langchain-openai>=0.3,<2",
  "langchain>=1.4,<2",
  "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "qdrant-client>=1.14,<2",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "e2b-code-interpreter>=2,<3",
  "deepagents>=0.6.12",
  "langchain-e2b>=0.0.6",
  "truststore>=0.10,<1",
  "streamlit>=1.42,<2",
  "langfuse>=5,<6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "jsonschema>=4,<5", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
